<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08111d" />

  <title>Mhamad Khalil | Mechanical Engineer</title>

  <meta
    name="description"
    content="Portfolio website for Mhamad Khalil, Mechanical Engineer."
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="page-glow page-glow-a"></div>
  <div class="page-glow page-glow-b"></div>


  <!-- HEADER -->
  <header class="site-header">

    <a
      href="#home"
      class="brand"
      aria-label="Mhamad Khalil home"
    >
      <img
        src="assets/logo.png"
        alt="MK logo"
      />
    </a>

  </header>


  <!-- MAIN -->
  <main
    id="home"
    class="main-content"
  >


    <!-- HERO -->
    <section class="hero-section">


      <!-- PERSON IMAGE -->
      <div class="hero-visual reveal">

        <div class="hero-visual-frame">

          <img
            src="assets/person.png"
            alt="Mhamad Khalil Mechanical Engineer"
          />

        </div>

      </div>



      <!-- HERO CONTENT -->
      <div class="hero-copy reveal delay-1">


        <div class="eyebrow-wrap">

          <span class="eyebrow">
            
          </span>

          <span class="eyebrow-line"></span>

        </div>



        



        <!-- NAME -->
        <h1>
          Mhamad
          <span>Khalil</span>
        </h1>



        <p class="role">
          Mechanical Engineer
        </p>



        <!-- SOCIAL MEDIA -->
        <div
          class="hero-actions"
          id="contact"
          aria-label="Social links"
        >


          <!-- TIKTOK -->
          <a
            class="social-button"
            href="https://www.tiktok.com/@mhaamad_06"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="TikTok"
            title="TikTok"
          >

            <img
              src="assets/tiktok.png"
              alt="TikTok"
            />

          </a>



          <!-- INSTAGRAM -->
          <a
            class="social-button"
            href="https://www.instagram.com/mhamaad.khalil"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
            title="Instagram"
          >

            <img
              src="assets/instagram.png"
              alt="Instagram"
            />

          </a>



          <!-- SNAPCHAT -->
          <a
            class="social-button"
            href="https://www.snapchat.com/add/mhamaad_khalil"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Snapchat"
            title="Snapchat"
          >

            <img
              src="assets/snapchat.png"
              alt="Snapchat"
            />

          </a>



          <!-- TELEGRAM -->
          <a
            class="social-button"
            href="https://t.me/mhamadr9"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram"
            title="Telegram"
          >

            <img
              src="assets/telegram.png"
              alt="Telegram"
            />

          </a>



          <!-- WHATSAPP -->
          <a
            class="social-button"
            href="https://wa.me/9647507994303"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="WhatsApp"
            title="WhatsApp"
          >

            <img
              src="assets/whatsapp.png"
              alt="WhatsApp"
            />

          </a>


        </div>

      </div>

    </section>



    <!-- ABOUT -->
    <section
      class="about-section reveal"
      id="about"
    >


      <div class="section-heading">

        <span></span>

        <div class="heading-line"></div>

      </div>



      <div class="about-card">


        <div></div>



        <div class="about-meta">


          <!-- UNIVERSITY -->
          <div class="meta-box">

            <span>
              UOD
            </span>

            <strong>
              University Of Duhok
            </strong>

          </div>



          <!-- DEPARTMENT -->
          <div class="meta-box">

            <span>
              Engineering Department
            </span>

            <strong>
              Mechanical Engineer
            </strong>

          </div>


        </div>

      </div>

    </section>


  </main>



  <!-- FOOTER -->
  <footer class="site-footer">


    <div class="footer-brand">

      <img
        src="assets/logo.png"
        alt="MK logo"
      />


      <div>

        <strong>
          Mhamad Khalil
        </strong>

        <span>
          Mechanical Engineer
        </span>

      </div>

    </div>



    


  </footer>



  <script src="script.js"></script>

</body>
</html>
